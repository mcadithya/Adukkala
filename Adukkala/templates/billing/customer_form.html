{% extends 'base.html' %}
{% block content %}

<h4>Edit Customer: {{ customer.name }}</h4>

<div class="row">
    <div class="col-md-6">
        <div class="card p-4">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Full Name:</label>
                    <input type="text" name="name" class="form-control" value="{{ customer.name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number:</label>
                    <input type="text" name="phone" class="form-control" value="{{ customer.phone|default:'' }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Address / Description:</label>
                    <textarea name="address" class="form-control" rows="3">{{ customer.address|default:'' }}</textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{% url 'customers_list' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
