{% extends "base.html" %}
{% block content %}
<h4>{{ expense_item|default:"Add" }} Expense Item</h4>

<form method="post" class="mt-3">
  {% csrf_token %}

  <div class="mb-3">
    <label class="form-label">Name *</label>
    <input name="name" class="form-control"
           placeholder="e.g., Rent, Utilities, Supplies" 
           value="{{ expense_item.name|default:'' }}" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Category</label>
    <input name="category" class="form-control"
           placeholder="e.g., Overhead, Maintenance" 
           value="{{ expense_item.category|default:'' }}">
  </div>

  <button class="btn btn-dark">Save</button>
  <a href="{% url 'expense_items' %}" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
