{% extends 'base.html' %}
{% block content %}

<h4>Add New Expense</h4>
<div class="border p-2 mb-3">
    <h6>Expense Items</h6>

    <div class="row g-2">

        {% for expense_item in expense_items %}
        <div class="col-md-3">
            <div class="card p-3 text-center"
                 style="cursor:pointer;"
                 onclick="selectExpense('{{ expense_item.name }}')">

                <strong>{{ expense_item.name }}</strong>

                {% if expense_item.category %}
                <small class="text-muted">
                    {{ expense_item.category }}
                </small>
                {% endif %}
            </div>
        </div>
        {% endfor %}

    </div>
</div>
<div class="row">
    <div class="col-md-6">
        <div class="card p-4">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Description:</label>
                    <input type="text" name="description" class="form-control"
                        placeholder="e.g., Vegetable purchase, Rent, Electricity" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Amount (₹):</label>
                    <input type="number" name="amount" class="form-control" placeholder="0" required min="1">
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Save Expense</button>
                    <a href="{% url 'expense_list' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
function selectExpense(name) {
    document.querySelector('input[name="description"]').value = name;
}
</script>
{% endblock %}
