{% extends "base.html" %}
{% block content %}
<h4>{{ item|default:"Add" }} Item</h4>

<form method="post" enctype="multipart/form-data" class="mt-3">
  {% csrf_token %}

  <div class="mb-3">
    <label class="form-label">Item Name *</label>
    <div style="position: relative;">
      <input id="itemNameInput" name="name" class="form-control"
             placeholder="Malayalam item name (e.g., ചായ, കാപ്പി, അരി)" 
             value="{{ item.name|default:'' }}" required autocomplete="off" spellcheck="true">
      <div id="suggestionsList" class="list-group position-absolute w-100" 
           style="top: 100%; left: 0; max-height: 200px; overflow-y: auto; display: none; z-index: 1000;">
      </div>
    </div>
  </div>

  <input name="price" type="number" class="form-control mb-2"
         placeholder="Price" value="{{ item.price|default:'' }}" required>

  <input name="image" type="file" class="form-control mb-3">

  <button class="btn btn-dark">Save</button>
  <a href="{% url 'items' %}" class="btn btn-secondary">Cancel</a>
</form>

const itemNameInput = document.getElementById('itemNameInput');
const suggestionsList = document.getElementById('suggestionsList');

itemNameInput.addEventListener('input', function() {
  const input = this.value.toLowerCase().trim();
  
  if (input.length < 1) {
    suggestionsList.style.display = 'none';
    return;
  }

  // Find matching translations - only match from the beginning (first word)
  const matches = Object.entries(translations).filter(([eng, mal]) => {
    const engLower = eng.toLowerCase();
    return engLower.startsWith(input);
  });

  if (matches.length > 0) {
    suggestionsList.innerHTML = matches.map(([eng, mal]) => `
      <button type="button" class="list-group-item list-group-item-action" 
              onclick="selectTranslation('${mal}', event)"
              style="text-align: left; padding: 10px; cursor: pointer;">
        <div><strong>${mal}</strong></div>
        <small class="text-muted">${eng.charAt(0).toUpperCase() + eng.slice(1)}</small>
      </button>
    `).join('');
    suggestionsList.style.display = 'block';
  } else {
    suggestionsList.style.display = 'none';
  }
});

function selectTranslation(malayalamText, event) {
  event.preventDefault();
  itemNameInput.value = malayalamText;
  suggestionsList.style.display = 'none';
  itemNameInput.focus();
}

// Hide suggestions when clicking outside
document.addEventListener('click', function(event) {
  if (!event.target.closest('#itemNameInput') && !event.target.closest('#suggestionsList')) {
    suggestionsList.style.display = 'none';
  }
});
</script>
{% endblock %}
